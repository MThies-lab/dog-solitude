<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONA LISA OVERDRIVE // VAPORWAVE DRIVE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f0528;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas {
            border: 2px solid #b400ff;
            box-shadow: 0 0 20px rgba(180, 0, 255, 0.5);
            display: block;
        }
        .container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        // ── Constants ──────────────────────────────────────────────────────────────────
        const W = 800;
        const H = 600;
        const FPS = 30;
        const HORIZON = Math.floor(H / 2) - 30;
        const ROAD_VANISH = Math.floor(W / 2);

        // Vaporwave palette
        const BG_TOP = [15, 5, 40];
        const BG_BOT = [40, 0, 60];
        const GRID_COL = [180, 0, 200];
        const GRID_GLOW = [255, 50, 220];
        const ROAD_COL = [25, 10, 50];
        const STRIPE_C = [255, 50, 200];
        const TREE_COL = [[0, 220, 120], [0, 180, 80], [0, 140, 60], [20, 255, 120]];
        const HILL_COL = [[80, 20, 100], [60, 10, 80], [40, 5, 60]];
        const GATOR_C = [0, 200, 80];
        const EYE_C = [255, 50, 50];
        const DASH_BG = [10, 0, 20];
        const DASH_BORD = [180, 0, 255];
        const LCD_BG = [0, 30, 10];
        const LCD_TXT = [0, 255, 100];
        const STAR_C = [255, 200, 255];

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ── Utility Functions ──────────────────────────────────────────────────────────
        function rgb(color) {
            return `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
        }

        function rgba(color, alpha) {
            return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randomChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function randomUniform(min, max) {
            return Math.random() * (max - min) + min;
        }

        // ── Stars ──────────────────────────────────────────────────────────────────────
        const stars = [];
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: randomInt(0, W),
                y: randomInt(0, HORIZON - 40),
                r: randomChoice([1, 1, 1, 2])
            });
        }

        // ── Grid state ─────────────────────────────────────────────────────────────────
        let grid_offset = 0.0;
        const speed = 3.5;

        // ── Road stripes ───────────────────────────────────────────────────────────────
        const stripes = [0, 1/6, 2/6, 3/6, 4/6, 5/6, 6/6].map(v => v);

        // ── Tree Class ─────────────────────────────────────────────────────────────────
        class Tree {
            constructor(side) {
                this.side = side;
                this.z = randomUniform(0.05, 1.0);
                this.color = randomChoice(TREE_COL);
            }

            reset() {
                this.z = 0.05;
                this.color = randomChoice(TREE_COL);
            }

            worldX() {
                const offset = this.side === 'L' ? -260 : 260;
                return ROAD_VANISH + Math.floor(offset * this.z);
            }

            worldY(offset = 0) {
                return perspectiveY(this.z, offset);
            }

            scale() {
                return Math.max(1, Math.floor(60 * this.z));
            }

            draw(offset = 0) {
                const cx = this.worldX();
                const by = this.worldY(offset);
                const s = this.scale();
                const c = this.color;
                const trunk_w = Math.max(2, Math.floor(s / 8));
                const trunk_h = Math.floor(s / 3);

                // Trunk
                ctx.fillStyle = rgb([80, 40, 10]);
                ctx.fillRect(cx - Math.floor(trunk_w / 2), by - trunk_h, trunk_w, trunk_h);

                // Layered canopy blobs
                const layers = [
                    [trunk_h + Math.floor(s / 2), s, Math.floor(s / 2)],
                    [trunk_h + s, Math.floor(s * 3 / 4), Math.floor(s / 3)],
                    [trunk_h + Math.floor(s * 3 / 2), Math.floor(s / 2), Math.floor(s / 4)]
                ];

                layers.forEach((layer, idx) => {
                    const [dy, rw, rh] = layer;
                    const shade = c.map(v => Math.max(0, v - idx * 30));
                    ctx.fillStyle = rgb(shade);
                    ctx.fillRect(cx - Math.floor(rw / 2), by - dy, rw, rh);
                });

                // Moss drape pixels
                const step = Math.max(2, Math.floor(s / 6));
                for (let i = 0; i < s; i += step) {
                    const px = cx - Math.floor(s / 2) + i;
                    const moss_len = randomInt(Math.floor(s / 6), Math.floor(s / 3));
                    ctx.strokeStyle = rgb([0, 180, 60]);
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, by - trunk_h - Math.floor(s / 4));
                    ctx.lineTo(px, by - trunk_h - Math.floor(s / 4) + moss_len);
                    ctx.stroke();
                }
            }
        }

        // ── Gator Class ────────────────────────────────────────────────────────────────
        class Gator {
            constructor(side) {
                this.side = side;
                this.z = randomUniform(0.1, 0.9);
                this.blink_t = randomInt(0, 59);
            }

            worldX() {
                const base = this.side === 'L' ? -320 : 320;
                return ROAD_VANISH + Math.floor(base * this.z);
            }

            worldY(offset = 0) {
                return perspectiveY(this.z, offset) - 20;
            }

            scale() {
                return Math.max(1, Math.floor(28 * this.z));
            }

            draw(tick, offset = 0) {
                const cx = this.worldX();
                const cy = this.worldY(offset);
                const s = this.scale();

                // Body
                ctx.fillStyle = rgb(GATOR_C);
                ctx.beginPath();
                ctx.ellipse(cx, cy, s, Math.floor(s / 3), 0, 0, Math.PI * 2);
                ctx.fill();

                // Snout
                const sx = this.side === 'R' ? cx + s : cx - s;
                ctx.fillStyle = rgb([0, 160, 60]);
                ctx.fillRect(sx - Math.floor(s / 2), cy - Math.floor(s / 4), Math.floor(s / 2), Math.floor(s / 4));

                // Eyes (blinking)
                const ew = Math.max(2, Math.floor(s / 6));
                const eyePositions = [cx - Math.floor(s / 3), cx + Math.floor(s / 3)];

                eyePositions.forEach(ex => {
                    if ((tick + this.blink_t) % 60 < 55) {
                        // Open
                        ctx.fillStyle = rgb(EYE_C);
                        ctx.fillRect(ex, cy - Math.floor(s / 2), ew, ew);
                    } else {
                        // Closed
                        ctx.strokeStyle = rgb(EYE_C);
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(ex, cy - Math.floor(s / 2) + Math.floor(ew / 2));
                        ctx.lineTo(ex + ew, cy - Math.floor(s / 2) + Math.floor(ew / 2));
                        ctx.stroke();
                    }
                });
            }
        }

        // Initialize trees and gators
        const trees_L = Array(8).fill(null).map(() => new Tree('L'));
        const trees_R = Array(8).fill(null).map(() => new Tree('R'));
        const gators = [
            ...Array(3).fill(null).map(() => new Gator('L')),
            ...Array(3).fill(null).map(() => new Gator('R'))
        ];

        // ── Jagged Hills ──────────────────────────────────────────────────────────────
        // Generate random jagged hill profiles for left and right sides
        function generateHillProfile(points) {
            const profile = [];
            for (let i = 0; i < points; i++) {
                profile.push(randomInt(20, 80));
            }
            return profile;
        }

        const hillsLeft = [
            { profile: generateHillProfile(15), color: HILL_COL[0], baseOffset: -500 },
            { profile: generateHillProfile(15), color: HILL_COL[1], baseOffset: -400 },
            { profile: generateHillProfile(15), color: HILL_COL[2], baseOffset: -300 }
        ];

        const hillsRight = [
            { profile: generateHillProfile(15), color: HILL_COL[0], baseOffset: 500 },
            { profile: generateHillProfile(15), color: HILL_COL[1], baseOffset: 400 },
            { profile: generateHillProfile(15), color: HILL_COL[2], baseOffset: 300 }
        ];

        function drawHills() {
            // Draw left hills (back to front)
            hillsLeft.forEach(hill => {
                ctx.fillStyle = rgb(hill.color);
                ctx.beginPath();
                ctx.moveTo(0, HORIZON);

                for (let i = 0; i < hill.profile.length; i++) {
                    const x = (i / hill.profile.length) * (W / 2);
                    const y = HORIZON - hill.profile[i];
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(W / 2, HORIZON);
                ctx.closePath();
                ctx.fill();
            });

            // Draw right hills (back to front)
            hillsRight.forEach(hill => {
                ctx.fillStyle = rgb(hill.color);
                ctx.beginPath();
                ctx.moveTo(W / 2, HORIZON);

                for (let i = 0; i < hill.profile.length; i++) {
                    const x = W / 2 + (i / hill.profile.length) * (W / 2);
                    const y = HORIZON - hill.profile[i];
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(W, HORIZON);
                ctx.closePath();
                ctx.fill();
            });
        }

        function drawSky() {
            for (let y = 0; y < HORIZON; y++) {
                const t = y / HORIZON;
                const r = Math.floor(BG_TOP[0] + (BG_BOT[0] - BG_TOP[0]) * t);
                const g = Math.floor(BG_TOP[1] + (BG_BOT[1] - BG_TOP[1]) * t);
                const b = Math.floor(BG_TOP[2] + (BG_BOT[2] - BG_TOP[2]) * t);
                ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
        }

        function drawStars(tick) {
            stars.forEach(star => {
                const bright = 150 + Math.floor(100 * Math.sin(tick * 0.05 + star.x));
                const col = [bright, Math.floor(bright * 0.7), bright];
                ctx.fillStyle = rgb(col);
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // ── Ground grid ───────────────────────────────────────────────────────────────
        const NUM_V_LINES = 20;
        const NUM_H_LINES = 12;

        // Terrain height variation
        function getTerrainHeight(z, offset) {
            // Create rolling hills effect with sine waves (slowed down)
            const wave1 = Math.sin((z + offset * 0.08) * Math.PI * 2) * 25;
            const wave2 = Math.sin((z + offset * 0.05) * Math.PI * 3) * 12;
            return wave1 + wave2;
        }

        function perspectiveX(wx, z) {
            return Math.floor(ROAD_VANISH + wx * z);
        }

        function perspectiveY(z, offset = 0) {
            const baseY = HORIZON + (H - HORIZON) * z;
            const heightOffset = getTerrainHeight(z, offset);
            return Math.floor(baseY + heightOffset);
        }

        function drawGrid(offset) {
            // Horizontal lines
            for (let i = 0; i <= NUM_H_LINES; i++) {
                const raw_z = (i + offset % 1) / NUM_H_LINES;
                const z = raw_z ** 2;
                if (z < 0.002) continue;

                const y = perspectiveY(z, offset);
                const brightness = Math.floor(80 + 175 * z);
                const col = [Math.min(255, brightness), 0, Math.min(255, brightness)];
                ctx.strokeStyle = rgb(col);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // Vertical lines (now curved to follow terrain)
            const spread = 900;
            for (let i = 0; i <= NUM_V_LINES; i++) {
                const t = i / NUM_V_LINES;
                const wx = -spread + t * spread * 2;
                const brightness = Math.floor(60 + 100 * Math.abs(t - 0.5) * 2);
                const col = [Math.min(255, brightness + 80), 0, Math.min(255, brightness + 120)];
                ctx.strokeStyle = rgb(col);
                ctx.lineWidth = 1;
                ctx.beginPath();

                // Draw vertical line as a curve following terrain
                const x0 = ROAD_VANISH;
                const y0 = HORIZON;
                ctx.moveTo(x0, y0);

                // Sample points along the line to create curve
                for (let step = 0; step <= 20; step++) {
                    const z_step = step / 20;
                    const x = perspectiveX(wx, z_step);
                    const y = perspectiveY(z_step, offset);
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        // ── Road ──────────────────────────────────────────────────────────────────────
        const ROAD_L_WORLD = -140;
        const ROAD_R_WORLD = 140;

        function drawRoad(offset) {
            // Road trapezoid (now follows terrain)
            ctx.fillStyle = rgb(ROAD_COL);
            ctx.beginPath();

            // Top edge (near horizon)
            ctx.moveTo(perspectiveX(ROAD_L_WORLD, 0.001), HORIZON);
            ctx.lineTo(perspectiveX(ROAD_R_WORLD, 0.001), HORIZON);

            // Right edge (curved with terrain)
            for (let step = 0; step <= 20; step++) {
                const z = step / 20;
                const x = perspectiveX(ROAD_R_WORLD, z);
                const y = perspectiveY(z, offset);
                ctx.lineTo(x, y);
            }

            // Left edge (curved with terrain, backwards)
            for (let step = 20; step >= 0; step--) {
                const z = step / 20;
                const x = perspectiveX(ROAD_L_WORLD, z);
                const y = perspectiveY(z, offset);
                ctx.lineTo(x, y);
            }

            ctx.closePath();
            ctx.fill();

            // Center dashes
            stripes.forEach((t, i) => {
                const z = ((t + offset) % 1.0) ** 2 + 0.01;
                const y = perspectiveY(z, offset);
                const w = Math.max(2, Math.floor(10 * z));
                const h = Math.max(3, Math.floor(20 * z));
                ctx.fillStyle = rgb(STRIPE_C);
                ctx.fillRect(ROAD_VANISH - Math.floor(w / 2), y - Math.floor(h / 2), w, h);
            });

            // Road edge lines (curved with terrain)
            [-1, 1].forEach(side => {
                const wx = side === -1 ? ROAD_L_WORLD : ROAD_R_WORLD;
                ctx.strokeStyle = rgb(GRID_GLOW);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(perspectiveX(wx, 0.001), HORIZON);

                for (let step = 0; step <= 20; step++) {
                    const z = step / 20;
                    const x = perspectiveX(wx, z);
                    const y = perspectiveY(z, offset);
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
        }

        // ── Dashboard ─────────────────────────────────────────────────────────────────
        const DASH_Y = H - 130;
        const DASH_H = 130;
        const RADIO_X = Math.floor(W / 2) - 110;
        const RADIO_Y = DASH_Y + 20;
        const RADIO_W = 220;
        const RADIO_H = 50;

        function drawDashboard(tick) {
            // Dash panel
            ctx.fillStyle = rgb(DASH_BG);
            ctx.fillRect(0, DASH_Y, W, DASH_H);
            ctx.strokeStyle = rgb(DASH_BORD);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, DASH_Y);
            ctx.lineTo(W, DASH_Y);
            ctx.stroke();

            // Steering wheel
            const sw_cx = Math.floor(W / 2);
            const sw_cy = DASH_Y + 90;
            const sw_r = 55;

            ctx.fillStyle = rgb([50, 0, 80]);
            ctx.beginPath();
            ctx.arc(sw_cx, sw_cy, sw_r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = rgb(DASH_BORD);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sw_cx, sw_cy, sw_r, 0, Math.PI * 2);
            ctx.stroke();

            // Spokes
            [0, 120, 240].forEach(ang => {
                const rad = ang * Math.PI / 180;
                const ex = sw_cx + Math.floor((sw_r - 5) * Math.cos(rad));
                const ey = sw_cy + Math.floor((sw_r - 5) * Math.sin(rad));
                ctx.strokeStyle = rgb(DASH_BORD);
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sw_cx, sw_cy);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            });

            ctx.fillStyle = rgb(DASH_BORD);
            ctx.beginPath();
            ctx.arc(sw_cx, sw_cy, 8, 0, Math.PI * 2);
            ctx.fill();

            // Left gauges
            ['SPD', 'RPM'].forEach((label, gi) => {
                const gx = 60 + gi * 140;
                const gy = DASH_Y + 15;

                ctx.fillStyle = rgb([20, 0, 40]);
                ctx.fillRect(gx, gy, 100, 40);
                ctx.strokeStyle = rgb(DASH_BORD);
                ctx.lineWidth = 2;
                ctx.strokeRect(gx, gy, 100, 40);

                const val = gi === 0
                    ? 88 + Math.floor(10 * Math.sin(tick * 0.07 + gi))
                    : 3200 + Math.floor(400 * Math.sin(tick * 0.11 + gi));

                ctx.fillStyle = rgb(LCD_TXT);
                ctx.font = 'bold 12px Courier New';
                ctx.fillText(`${label}: ${val}`, gx + 6, gy + 25);
            });

            // Radio LCD screen
            ctx.fillStyle = rgb(LCD_BG);
            ctx.fillRect(RADIO_X, RADIO_Y, RADIO_W, RADIO_H);
            ctx.strokeStyle = rgb([0, 255, 100]);
            ctx.lineWidth = 2;
            ctx.strokeRect(RADIO_X, RADIO_Y, RADIO_W, RADIO_H);

            // Scrolling text
            const scroll_txt = "  ♪ MONA LISA OVERDRIVE ♪  ";
            const char_w = 10;
            const total_w = scroll_txt.length * char_w;
            const offset_x = -(tick * 2) % total_w;

            ctx.save();
            ctx.beginPath();
            ctx.rect(RADIO_X + 4, RADIO_Y + 5, RADIO_W - 8, RADIO_H - 10);
            ctx.clip();

            ctx.fillStyle = rgb(LCD_TXT);
            ctx.font = 'bold 16px Courier New';
            for (let rep = 0; rep < 3; rep++) {
                ctx.fillText(scroll_txt, RADIO_X + 4 + offset_x + rep * total_w, RADIO_Y + 25);
            }
            ctx.restore();

            // Waveform bars
            for (let bx = RADIO_X + 4; bx < RADIO_X + RADIO_W - 4; bx += 6) {
                const bh = Math.floor(6 + 6 * Math.sin(tick * 0.3 + bx * 0.2));
                ctx.fillStyle = rgb([0, 200, 80]);
                ctx.fillRect(bx, RADIO_Y + RADIO_H - 12 - bh, 4, bh);
            }

            // Right: vaporwave label
            ctx.fillStyle = rgb([255, 80, 220]);
            ctx.font = 'bold 22px Courier New';
            ctx.fillText("V A P O R W A V E", W - 220, DASH_Y + 35);

            ctx.fillStyle = rgb([180, 0, 255]);
            ctx.font = 'bold 12px Courier New';
            ctx.fillText("// OVERDRIVE MODE //", W - 190, DASH_Y + 60);
        }

        // ── Scanlines overlay ─────────────────────────────────────────────────────────
        function drawScanlines() {
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            for (let y = 0; y < H; y += 3) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ── CRT border ─────────────────────────────────────────────────────────────────
        function drawCrtBorder(tick) {
            const alpha = 80 + 40 * Math.sin(tick * 0.05);
            for (let i = 0; i < 12; i++) {
                const a = Math.max(0, alpha - i * 7) / 255;
                ctx.strokeStyle = rgba([120, 0, 200], a);
                ctx.lineWidth = 1;
                ctx.strokeRect(i, i, W - i * 2, H - i * 2);
            }
        }

        // ── Scroll objects ────────────────────────────────────────────────────────────
        function updateScroll(objects, speed) {
            objects.forEach(obj => {
                obj.z += speed * 0.012;
                if (obj.z >= 1.0) {
                    obj.z = 0.05;
                    if (obj.reset) obj.reset();
                }
            });
        }

        // ── Main loop ─────────────────────────────────────────────────────────────────
        let tick = 0;
        let lastTime = 0;
        const frameTime = 1000 / FPS;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            // Throttle to target FPS
            if (currentTime - lastTime < frameTime) return;
            lastTime = currentTime;

            grid_offset += speed * 0.04;

            // Draw layers
            drawSky();
            drawStars(tick);
            drawHills();
            drawGrid(grid_offset);
            drawRoad(grid_offset);

            // Sort all side objects by depth
            const side_objects = [...trees_L, ...trees_R, ...gators].sort((a, b) => a.z - b.z);
            side_objects.forEach(obj => {
                if (obj instanceof Tree) {
                    obj.draw(grid_offset);
                } else {
                    obj.draw(tick, grid_offset);
                }
            });

            drawDashboard(tick);
            drawScanlines();
            drawCrtBorder(tick);

            // Advance objects
            updateScroll(trees_L, speed);
            updateScroll(trees_R, speed);
            gators.forEach(g => {
                g.z += speed * 0.010;
                if (g.z >= 1.0) {
                    g.z = 0.1;
                }
            });

            // Stripe scroll
            for (let i = 0; i < stripes.length; i++) {
                stripes[i] = (stripes[i] + speed * 0.005) % 1.0;
            }

            tick++;
        }

        // Start animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
